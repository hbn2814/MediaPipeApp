<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>손가락 퀴즈 | MediaPipe 학교 앱</title>
  <!-- 아이콘·공유 미리보기 -->
  <meta name="description" content="정답 번호만큼 손가락을 펴서 답하는 퀴즈. MediaPipe 손 인식으로 만든 입문 앱." />
  <meta name="theme-color" content="#0b0f1a" />
  <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="../../favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="../../apple-touch-icon.png" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="MediaPipe 학교 탐구 앱" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:title" content="☝️ 손가락 퀴즈 · MediaPipe 입문 앱" />
  <meta property="og:description" content="정답 번호만큼 손가락을 펴서 답하는 퀴즈. MediaPipe 손 인식으로 만든 입문 앱." />
  <meta property="og:url" content="https://hbn2814.github.io/MediaPipeApp/project1/finger-quiz/" />
  <meta property="og:image" content="https://hbn2814.github.io/MediaPipeApp/assets/og/og-main.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="☝️ 손가락 퀴즈 · MediaPipe 입문 앱" />
  <meta name="twitter:card" content="summary_large_image" />
  <!-- /아이콘·공유 미리보기 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      --bg: #edf1f5;
      --panel: #ffffff;
      --ink: #0e1a2b;
      --muted: #58687c;
      --line: #d6dee8;
      --accent: #2f6bff;
      --accent-soft: #e3ebff;
      --good: #0f9f6e;
      --good-soft: #e1f5ec;
      --bad: #e5484d;
      --bad-soft: #fdeced;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }
    .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; max-width: 1280px; margin: 0 auto; padding: 20px 24px 8px; }
    .top a { color: var(--muted); text-decoration: none; font-size: 14px; }
    .top h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
    .top p { margin: 0; color: var(--muted); }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; max-width: 1280px; margin: 0 auto; padding: 12px 24px 32px; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

    .stage { position: relative; align-self: start; aspect-ratio: 16 / 9; border-radius: var(--radius); overflow: hidden; background: #0b1220; }
    .stage video, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); /* 거울처럼 좌우 반전 */ }
    .badge { position: absolute; left: 14px; top: 14px; padding: 6px 12px; border-radius: 999px; background: rgba(11, 18, 32, 0.72); color: #fff; font-weight: 700; }
    .overlay { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; padding: 24px; text-align: center; background: rgba(11, 18, 32, 0.78); color: #fff; }
    .overlay p { margin: 0; max-width: 34em; color: #c9d3e0; font-size: 14px; }
    button { font: inherit; cursor: pointer; }
    .primary { padding: 14px 26px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-size: 18px; font-weight: 700; }
    .primary:disabled { opacity: 0.6; cursor: progress; }
    .secondary { padding: 10px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); font-weight: 600; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .panel { display: flex; flex-direction: column; gap: 16px; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
    .meta { display: flex; justify-content: space-between; color: var(--muted); }
    .meta b { color: var(--ink); font-variant-numeric: tabular-nums; }
    .question { margin: 0; font-size: 28px; line-height: 1.3; letter-spacing: -0.02em; text-wrap: balance; }
    .choices { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
    .choice { position: relative; display: flex; align-items: center; gap: 14px; padding: 12px 14px; overflow: hidden; border: 2px solid var(--line); border-radius: 14px; font-size: 20px; font-weight: 600; }
    .choice .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent-soft); }
    .choice .num, .choice .text { position: relative; }
    .choice .num { display: grid; place-items: center; flex: none; width: 38px; height: 38px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 800; }
    .choice.holding { border-color: var(--accent); }
    .choice.correct { border-color: var(--good); background: var(--good-soft); }
    .choice.correct .num { background: var(--good); }
    .choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
    .choice.wrong .num { background: var(--bad); }
    .message { min-height: 3em; margin: 0; color: var(--muted); font-size: 17px; }
    .message.good { color: var(--good); font-weight: 700; }
    .message.bad { color: var(--bad); font-weight: 700; }
    .howto { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--bg); color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header class="top">
    <a href="../">← 앱 목록</a>
    <h1>손가락 퀴즈</h1>
    <p>정답 번호만큼 손가락을 펴고 1.5초 동안 유지하세요.</p>
  </header>

  <main>
    <section class="stage" id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="canvas"></canvas>
      <div class="badge" id="fingerBadge">손을 보여 주세요</div>
      <div class="overlay" id="overlay">
        <button class="primary" id="startBtn" type="button">카메라 켜고 시작하기</button>
        <p id="overlayMsg">카메라 영상은 저장하거나 전송하지 않고, 이 컴퓨터 안에서만 처리해요.</p>
      </div>
    </section>

    <aside class="panel">
      <div class="meta">
        <span>문제 <b id="qNum">1</b> / <b id="qTotal">5</b></span>
        <span>점수 <b id="score">0</b></span>
      </div>
      <h2 class="question" id="question">문제를 불러오는 중…</h2>
      <ol class="choices" id="choices"></ol>
      <p class="message" id="message" aria-live="polite"></p>
      <button class="secondary" id="restartBtn" type="button" hidden>처음부터 다시</button>
      <p class="howto">☝️ 1번 = 검지 · ✌️ 2번 = 검지+중지 · 3번 = +약지 · 4번 = +소지<br />엄지는 세지 않아요. 문제는 <code>questions.js</code>에서 바꿀 수 있어요.</p>
    </aside>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
